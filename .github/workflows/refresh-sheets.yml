
name: Refresh Google Sheets data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to receive refreshed static data"
        required: true
        default: "cloudflare-migration"

permissions:
  contents: write

concurrency:
  group: refresh-google-sheets-data
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exporter
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-auth requests

      - name: Export Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/export_sheets.py --output /tmp/exported-data

      - name: Copy exports to target branch
        env:
          TARGET_BRANCH: ${{ github.event.inputs.target_branch || 'cloudflare-migration' }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          mkdir -p data
          cp -a /tmp/exported-data/. data/
          git add data/
          if git diff --cached --quiet; then
            echo "No exported data changed; skipping commit."
          else
            git commit -m "Refresh exported Google Sheets data"
            git push origin "$TARGET_BRANCH"
          fi
